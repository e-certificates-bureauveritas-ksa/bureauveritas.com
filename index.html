<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* পুরো স্ক্রিন ১০০% ফিট করা এবং স্ক্রলবার ও জুম সম্পূর্ণ বন্ধ করা */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* কোনো স্ক্রলবার আসবে না */
            background-color: #f7fafc;
            font-family: sans-serif;
            touch-action: none; /* জুম বা স্ক্রল লক করার জন্য */
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ইমেজটিকে স্ক্রিনের ভেতর পারফেক্টলি ফিট করার আসল ট্রিক */
        #imagePreview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* ছবি বিকৃত না করে স্ক্রিনের ভেতর ১০০% ফিট রাখবে */
            display: none; /* প্রথমে হাইড থাকবে */
        }

        #status {
            font-size: 18px;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div id="status">Loading...</div>
    <!-- আইফ্রেম বাদ দিয়ে সরাসরি ইমেজ ট্যাগ ব্যবহার করা হলো -->
    <img id="imagePreview" src="" alt="Document Preview">

<script>
    const secretKey = "MyGitHubSecureKey123";

    const urlParams = new URLSearchParams(window.location.search);
    const encryptedData = urlParams.get('file');
    const statusDiv = document.getElementById('status');
    const imgPreview = document.getElementById('imagePreview'); // ইমেজ ট্যাগ সিলেক্ট করা হলো

    if (encryptedData) {
        try {
            let formattedData = encryptedData.replace(/-/g, '+').replace(/_/g, '/');
            
            const bytes = CryptoJS.AES.decrypt(formattedData, secretKey);
            const decryptedLink = bytes.toString(CryptoJS.enc.Utf8);

            if (decryptedLink && decryptedLink.startsWith('http')) {
                statusDiv.style.display = 'none'; // Loading লেখা মুছে যাবে
                
                imgPreview.src = decryptedLink; // ডিক্রিপ্ট হওয়া লিঙ্কটি ছবিতে সেট হবে
                imgPreview.style.display = 'block'; // ছবি শো করবে
            } else {
                statusDiv.innerText = "Error: Invalid file link.";
            }
        } catch (e) {
            statusDiv.innerText = "Error: Decryption failed.";
        }
    } else {
        statusDiv.innerText = "Error: No file specified.";
    }
</script>

</body>
</html>

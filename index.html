<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- মোবাইলে ১০০% জুম ফিক্সড রাখা এবং ইউজার জুম বন্ধ করার জন্য ভিউপোর্ট ট্যাগ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redirecting...</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* পুরো স্ক্রিন ১০০% ফিট করা এবং স্ক্রলবার ও জুমের ঝামেলা বন্ধ করা */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* স্ক্রলবার বন্ধ রাখবে */
            background-color: #f7fafc;
            font-family: sans-serif;
            
            /* মোবাইল ব্রাউজারের ডিফল্ট বাউন্স বা অতিরিক্ত স্ক্রলিং ইফেক্ট বন্ধ করার জন্য */
            touch-action: none; 
            -webkit-text-size-adjust: 100%; /* iOS/Android এ টেক্সট সাইজ ফিক্সড রাখবে */
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* আইফ্রেমটি যেন স্ক্রিনের ভেতরে ১০০% ফিট হয়ে থাকে */
        #filePreview {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        #status {
            font-size: 18px;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div id="status">Loading...</div>
    <iframe id="filePreview" src=""></iframe>

<script>
    const secretKey = "MyGitHubSecureKey123";

    const urlParams = new URLSearchParams(window.location.search);
    const encryptedData = urlParams.get('file');
    const statusDiv = document.getElementById('status');
    const previewFrame = document.getElementById('filePreview');

    if (encryptedData) {
        try {
            let formattedData = encryptedData.replace(/-/g, '+').replace(/_/g, '/');
            
            const bytes = CryptoJS.AES.decrypt(formattedData, secretKey);
            const decryptedLink = bytes.toString(CryptoJS.enc.Utf8);

            if (decryptedLink && decryptedLink.startsWith('http')) {
                statusDiv.style.display = 'none';
                previewFrame.src = decryptedLink;
                previewFrame.style.display = 'block';
            } else {
                statusDiv.innerText = "Error: Invalid file link.";
            }
        } catch (e) {
            statusDiv.innerText = "Error: Decryption failed.";
        }
    } else {
        statusDiv.innerText = "Error: No file specified.";
    }
</script>

</body>
</html>

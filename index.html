<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Document Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* পুরো স্ক্রিনের মার্জিন-প্যাডিং জিরো করা */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* স্ক্রলবার বন্ধ রাখবে */
            background-color: #f7fafc;
            font-family: sans-serif;
            touch-action: none; /* জুম লক করার জন্য */
        }
        
        body {
            display: block; /* ফ্লেক্স বক্স সরিয়ে ব্লক করা হলো যাতে ফাইল ওপরে চলে যায় */
        }

        /* ইমেজটিকে একদম ওপরে জিরো গ্যাপে ফিট করার স্টাইল */
        #imagePreview {
            width: 100%;
            max-width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
            display: none; /* প্রথমে হাইড থাকবে */
            margin-top: 0; /* ওপরে কোনো ফাঁকা জায়গা রাখবে না */
            padding-top: 0;
        }

        /* লোডিং স্টাইলটিকে স্ক্রিনের মাঝখানে রাখার জন্য আলাদা পজিশন */
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <div id="status">Loading...</div>
    <img id="imagePreview" src="" alt="Document Preview">

<script>
    const secretKey = "MyGitHubSecureKey123";

    const urlParams = new URLSearchParams(window.location.search);
    const encryptedData = urlParams.get('file');
    const statusDiv = document.getElementById('status');
    const imgPreview = document.getElementById('imagePreview');

    if (encryptedData) {
        try {
            let formattedData = encryptedData.replace(/-/g, '+').replace(/_/g, '/');
            
            const bytes = CryptoJS.AES.decrypt(formattedData, secretKey);
            const decryptedLink = bytes.toString(CryptoJS.enc.Utf8);

            if (decryptedLink && decryptedLink.startsWith('http')) {
                statusDiv.style.display = 'none';
                imgPreview.src = decryptedLink;
                imgPreview.style.display = 'block';
            } else {
                statusDiv.innerText = "Error: Invalid file link.";
            }
        } catch (e) {
            statusDiv.innerText = "Error: Decryption failed.";
        }
    } else {
        statusDiv.innerText = "Error: No file specified.";
    }
</script>

</body>
</html>
